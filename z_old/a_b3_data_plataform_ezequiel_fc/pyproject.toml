[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "b3-data-platform"
version = "0.1.0"
description = "Financial data lakehouse using Medallion architecture for B3 data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "numpy>=1.26.0",
    "pyarrow>=14.0.0",
    "yfinance>=0.2.36",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "fpdf2>=2.7.0",
    "plotly>=5.18.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5.0",
    "delta-spark>=3.1.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "typer>=0.12.0",
]
docker = [
    "apache-airflow>=2.9.0",
    "boto3>=1.34.0",
    "s3fs>=2024.2.0",
]

[tool.pytest.ini_options]
testpaths = ["l_tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
